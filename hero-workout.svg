<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of GIM students working out with dumbbells outside a hostel gym">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2C4A66"/>
      <stop offset="55%" stop-color="#5A7C93"/>
      <stop offset="100%" stop-color="#D8A248"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C1442A"/>
      <stop offset="100%" stop-color="#8C2E1C"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="700" fill="url(#sky)"/>

  <!-- distant buildings -->
  <g opacity="0.55">
    <rect x="0" y="150" width="140" height="260" fill="#3F5D3A"/>
    <rect x="150" y="110" width="110" height="300" fill="#2C4A66"/>
    <rect x="980" y="130" width="120" height="280" fill="#2C4A66"/>
    <rect x="1090" y="90" width="110" height="320" fill="#3F5D3A"/>
    <circle cx="1000" cy="90" r="8" fill="#D8A248"/>
    <circle cx="1050" cy="70" r="5" fill="#F4E6C9"/>
  </g>

  <!-- palm -->
  <g transform="translate(1030,260)">
    <rect x="-8" y="0" width="16" height="220" fill="#3F5D3A"/>
    <path d="M0 0 C -70 -30 -110 -70 -140 -40 C -100 -20 -60 0 0 20" fill="#4E7A45"/>
    <path d="M0 0 C 70 -30 110 -70 140 -40 C 100 -20 60 0 0 20" fill="#3F5D3A"/>
    <path d="M0 0 C -30 -70 -20 -120 -50 -160 C -20 -120 0 -80 10 -20" fill="#4E7A45"/>
    <path d="M0 0 C 30 -70 20 -120 50 -160 C 20 -120 0 -80 -10 -20" fill="#3F5D3A"/>
  </g>

  <!-- hostel gym building -->
  <rect x="120" y="260" width="820" height="360" fill="url(#wall)"/>
  <rect x="120" y="260" width="820" height="18" fill="#5C1E11"/>

  <!-- awning -->
  <path d="M150 340 L 470 340 L 440 400 L 120 400 Z" fill="#E4623F"/>
  <path d="M150 340 L470 340 L465 352 L155 352 Z" fill="#F4A27A"/>
  <g stroke="#8C2E1C" stroke-width="4">
    <line x1="180" y1="340" x2="155" y2="400"/>
    <line x1="240" y1="340" x2="220" y2="400"/>
    <line x1="300" y1="340" x2="285" y2="400"/>
    <line x1="360" y1="340" x2="350" y2="400"/>
    <line x1="420" y1="340" x2="415" y2="400"/>
  </g>

  <!-- gym doorway -->
  <rect x="330" y="360" width="220" height="240" fill="#1E140F"/>
  <rect x="330" y="360" width="220" height="240" fill="#241A14" opacity="0.4"/>

  <!-- signage -->
  <text x="440" y="330" text-anchor="middle" font-family="'Baloo 2', cursive" font-size="46" font-weight="700" fill="#FBF3E7">GIMKHANA</text>
  <text x="440" y="356" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="15" letter-spacing="3" fill="#F4A27A">HOSTEL GYM</text>

  <!-- window -->
  <rect x="600" y="330" width="150" height="110" rx="6" fill="#1E140F"/>
  <rect x="600" y="330" width="150" height="110" rx="6" fill="none" stroke="#5C1E11" stroke-width="6"/>
  <g opacity="0.5" fill="#D8A248">
    <circle cx="640" cy="370" r="4"/>
    <circle cx="670" cy="380" r="4"/>
    <circle cx="700" cy="365" r="4"/>
  </g>

  <!-- ground -->
  <rect x="0" y="600" width="1200" height="100" fill="#241A14"/>
  <rect x="0" y="600" width="1200" height="6" fill="#3F2A1F"/>

  <!-- === WORKOUT GROUP === -->
  <!-- guy 1: dumbbell curl -->
  <g transform="translate(190,470)">
    <ellipse cx="35" cy="140" rx="46" ry="10" fill="#000" opacity="0.18"/>
    <rect x="10" y="60" width="50" height="70" rx="14" fill="#E4623F"/>
    <circle cx="35" cy="38" r="24" fill="#8C5A3C"/>
    <path d="M11 30 Q35 6 59 30 L59 22 Q35 -4 11 22 Z" fill="#241A14"/>
    <rect x="-8" y="70" width="20" height="55" rx="9" fill="#8C5A3C"/>
    <rect x="60" y="55" width="20" height="55" rx="9" fill="#8C5A3C" transform="rotate(-25 70 82)"/>
    <circle cx="86" cy="46" r="10" fill="#241A14"/>
    <rect x="80" y="40" width="14" height="12" fill="#241A14"/>
    <rect x="20" y="126" width="16" height="48" fill="#2C4A66"/>
    <rect x="40" y="126" width="16" height="48" fill="#2C4A66"/>
  </g>

  <!-- guy 2: overhead press, center hero -->
  <g transform="translate(330,440)">
    <ellipse cx="45" cy="170" rx="58" ry="12" fill="#000" opacity="0.2"/>
    <rect x="10" y="70" width="70" height="90" rx="18" fill="#D8A248"/>
    <circle cx="45" cy="44" r="28" fill="#7A4A30"/>
    <path d="M12 34 Q45 4 78 34 L78 24 Q45 -6 12 24 Z" fill="#1E140F"/>
    <rect x="-14" y="20" width="22" height="66" rx="10" fill="#7A4A30" transform="rotate(18 -3 53)"/>
    <rect x="72" y="20" width="22" height="66" rx="10" fill="#7A4A30" transform="rotate(-18 83 53)"/>
    <circle cx="-30" cy="10" r="13" fill="#241A14"/>
    <rect x="-42" y="2" width="24" height="16" fill="#241A14"/>
    <circle cx="102" cy="10" r="13" fill="#241A14"/>
    <rect x="90" y="2" width="24" height="16" fill="#241A14"/>
    <rect x="26" y="158" width="18" height="58" fill="#241A14"/>
    <rect x="48" y="158" width="18" height="58" fill="#241A14"/>
    <rect x="20" y="212" width="26" height="10" fill="#1E140F"/>
    <rect x="46" y="212" width="26" height="10" fill="#1E140F"/>
  </g>

  <!-- guy 3: bench-ish spotting -->
  <g transform="translate(500,480)">
    <ellipse cx="40" cy="130" rx="50" ry="10" fill="#000" opacity="0.18"/>
    <rect x="10" y="55" width="60" height="70" rx="16" fill="#3F5D3A"/>
    <circle cx="40" cy="32" r="25" fill="#8C5A3C"/>
    <path d="M13 24 Q40 -2 67 24 L67 15 Q40 -12 13 15 Z" fill="#241A14"/>
    <rect x="-6" y="62" width="20" height="52" rx="9" fill="#8C5A3C" transform="rotate(20 4 88)"/>
    <rect x="58" y="62" width="20" height="52" rx="9" fill="#8C5A3C" transform="rotate(-20 68 88)"/>
    <rect x="18" y="122" width="16" height="46" fill="#1E140F"/>
    <rect x="42" y="122" width="16" height="46" fill="#1E140F"/>
  </g>

  <!-- cheering guy sitting, water bottle -->
  <g transform="translate(700,520)">
    <ellipse cx="30" cy="90" rx="44" ry="9" fill="#000" opacity="0.18"/>
    <rect x="5" y="35" width="50" height="55" rx="14" fill="#C1442A"/>
    <circle cx="30" cy="18" r="20" fill="#7A4A30"/>
    <path d="M9 10 Q30 -8 51 10 L51 4 Q30 -14 9 4 Z" fill="#1E140F"/>
    <rect x="52" y="40" width="16" height="16" rx="4" fill="#D8A248"/>
    <rect x="10" y="88" width="14" height="34" fill="#241A14"/>
    <rect x="30" y="88" width="14" height="34" fill="#241A14"/>
  </g>

  <!-- dumbbell rack silhouette -->
  <g transform="translate(830,560)" opacity="0.9">
    <rect x="0" y="0" width="90" height="10" rx="4" fill="#1E140F"/>
    <rect x="0" y="18" width="90" height="10" rx="4" fill="#1E140F"/>
    <rect x="10" y="-6" width="10" height="46" fill="#3F2A1F"/>
    <rect x="70" y="-6" width="10" height="46" fill="#3F2A1F"/>
  </g>

  <!-- fairy lights across awning to gym -->
  <g fill="#D8A248">
    <circle cx="150" cy="400" r="3"/><circle cx="220" cy="410" r="3"/><circle cx="290" cy="404" r="3"/>
    <circle cx="360" cy="412" r="3"/><circle cx="430" cy="406" r="3"/>
  </g>
</svg>
